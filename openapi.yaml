openapi: 3.0.3
info:
  title: ClyvoVet API
  description: >
    API REST do ClyvoVet Mobile — gestão de consultas, animais e responsáveis.
    Cada usuário só enxerga os próprios dados.


    **Como testar:** primeiro chame POST /auth/cadastro (ou /auth/login se já
    tiver conta) para obter um token. Depois clique no botão "Authorize" no
    topo desta página e cole o token (sem a palavra "Bearer", o Swagger já
    adiciona isso sozinho). A partir daí, todas as rotas protegidas enviam
    o token automaticamente.
  version: 1.0.0

servers:
  - url: https://apirest-node-chllng.onrender.com
    description: Servidor em produção (Render)
  - url: http://localhost:3000
    description: Servidor local de desenvolvimento

tags:
  - name: Health
    description: Verificação de status do servidor
  - name: Autenticação
    description: Cadastro, login e logout — não exigem token
  - name: Consultas
  - name: Animais
  - name: Responsáveis

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Verifica se o servidor está no ar
      security: []
      responses:
        '200':
          description: Servidor funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/cadastro:
    post:
      tags: [Autenticação]
      summary: Cria uma nova conta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroInput'
            example:
              nome: "Maria Veterinária"
              email: "maria@clyvovet.dev"
              senha: "senha123456"
      responses:
        '201':
          description: Conta criada, token retornado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/CamposObrigatorios'
        '409':
          description: Já existe uma conta com este e-mail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica com e-mail e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: "maria@clyvovet.dev"
              senha: "senha123456"
      responses:
        '200':
          description: Login efetuado, token retornado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/CamposObrigatorios'
        '401':
          description: E-mail ou senha incorretos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão (o token deve ser descartado pelo app)
      security: []
      responses:
        '200':
          description: Logout confirmado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/perfil:
    get:
      tags: [Autenticação]
      summary: Busca os dados do usuário logado (nome, e-mail)
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_usuario:
                    type: integer
                  nm_usuario:
                    type: string
                  email_usuario:
                    type: string
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags: [Autenticação]
      summary: Atualiza nome, e-mail e (opcionalmente) senha do usuário logado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarPerfilInput'
            example:
              nome: "Maria Veterinária"
              email: "maria@clyvovet.dev"
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_usuario:
                    type: integer
                  nm_usuario:
                    type: string
                  email_usuario:
                    type: string
        '400':
          $ref: '#/components/responses/CamposObrigatorios'

  /auth/conta:
    delete:
      tags: [Autenticação]
      summary: Apaga a conta do usuário logado (exige confirmação de senha)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApagarContaInput'
            example:
              senha: "senha123456"
      responses:
        '204':
          description: Conta apagada com sucesso
        '400':
          $ref: '#/components/responses/CamposObrigatorios'
        '401':
          description: Senha incorreta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /responsaveis:
    get:
      tags: [Responsáveis]
      summary: Lista responsáveis do usuário (ou busca por CPF)
      parameters:
        - name: cpf
          in: query
          required: false
          description: Se informado, retorna o responsável com esse CPF (ou null) em vez da lista completa
          schema:
            type: string
      responses:
        '200':
          description: Lista de responsáveis (ou um único objeto/null, se filtrado por cpf)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Responsavel'
                  - $ref: '#/components/schemas/Responsavel'
                nullable: true
    post:
      tags: [Responsáveis]
      summary: Cria um novo responsável
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsavelInput'
            example:
              cpf_responsavel: "12345678900"
              nm_responsavel: "Maria Silva"
              nr_telefone_responsavel: "11999998888"
      responses:
        '201':
          description: Responsável criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Responsavel'
        '400':
          $ref: '#/components/responses/CamposObrigatorios'

  /responsaveis/{id}:
    get:
      tags: [Responsáveis]
      summary: Busca um responsável por id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Responsável encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Responsavel'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags: [Responsáveis]
      summary: Atualiza um responsável
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsavelInput'
      responses:
        '200':
          description: Responsável atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Responsavel'
        '400':
          $ref: '#/components/responses/CamposObrigatorios'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    delete:
      tags: [Responsáveis]
      summary: Remove um responsável (cascata — remove animais e consultas vinculados)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removido com sucesso
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /animais:
    get:
      tags: [Animais]
      summary: Lista animais do usuário (ou busca por microchip)
      parameters:
        - name: microchip
          in: query
          required: false
          description: Se informado, retorna o animal com esse microchip (ou null) em vez da lista completa
          schema:
            type: string
      responses:
        '200':
          description: Lista de animais (ou um único objeto/null, se filtrado por microchip)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/Animal'
                  - $ref: '#/components/schemas/Animal'
                nullable: true
    post:
      tags: [Animais]
      summary: Cria um novo animal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalInput'
            example:
              nm_animal: "Bidu"
              especie_animal: "Cachorro"
              raca_animal: "Vira-lata"
              dt_nascimento_animal: "2023-05-10"
              peso_animal: 12.5
              rg_animal: null
              nr_microchip_animal: "9988"
              id_responsavel: 1
      responses:
        '201':
          description: Animal criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
        '400':
          $ref: '#/components/responses/CamposObrigatorios'

  /animais/{id}:
    get:
      tags: [Animais]
      summary: Busca um animal por id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Animal encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags: [Animais]
      summary: Atualiza um animal
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalInput'
      responses:
        '200':
          description: Animal atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
        '400':
          $ref: '#/components/responses/CamposObrigatorios'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    delete:
      tags: [Animais]
      summary: Remove um animal (cascata — remove consultas vinculadas)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removido com sucesso
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /animais/{id}/consultas:
    get:
      tags: [Animais]
      summary: Lista o histórico de consultas de um animal
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Lista de consultas do animal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consulta'

  /consultas:
    get:
      tags: [Consultas]
      summary: Lista consultas do usuário
      responses:
        '200':
          description: Lista de consultas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consulta'
    post:
      tags: [Consultas]
      summary: Cria uma nova consulta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaInput'
            example:
              historico_consulta: "Check-up anual, tudo normal"
              dt_consulta: "2026-09-15"
              hr_consulta: "10:00"
              st_consulta: "Agendado"
              id_animal: 1
      responses:
        '201':
          description: Consulta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consulta'
        '400':
          $ref: '#/components/responses/CamposObrigatorios'

  /consultas/{id}:
    get:
      tags: [Consultas]
      summary: Busca uma consulta por id
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Consulta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consulta'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags: [Consultas]
      summary: Atualiza uma consulta
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaUpdateInput'
            example:
              historico_consulta: "Check-up anual — concluído sem alterações"
              dt_consulta: "2026-09-15"
              hr_consulta: "10:00"
              st_consulta: "Concluido"
      responses:
        '200':
          description: Consulta atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consulta'
        '400':
          $ref: '#/components/responses/CamposObrigatorios'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    delete:
      tags: [Consultas]
      summary: Remove uma consulta
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Removida com sucesso
        '404':
          $ref: '#/components/responses/NaoEncontrado'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token obtido em POST /auth/login ou POST /auth/cadastro.
        Cole apenas o token no botão "Authorize" — o prefixo "Bearer" é
        adicionado automaticamente pelo Swagger UI.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    NaoEncontrado:
      description: Registro não encontrado (ou não pertence ao usuário)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    CamposObrigatorios:
      description: Campos obrigatórios ausentes ou inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  schemas:
    Erro:
      type: object
      properties:
        error:
          type: string

    CadastroInput:
      type: object
      required: [nome, email, senha]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          description: Mínimo 6 caracteres

    LoginInput:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT — use no botão "Authorize" para as demais rotas
        usuario:
          type: object
          properties:
            id_usuario:
              type: integer
            nm_usuario:
              type: string
            email_usuario:
              type: string

    AtualizarPerfilInput:
      type: object
      required: [nome, email]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          description: Opcional — só envie se quiser trocar a senha atual. Mínimo 6 caracteres.

    ApagarContaInput:
      type: object
      required: [senha]
      properties:
        senha:
          type: string
          format: password
          description: Senha atual, exigida para confirmar a exclusão da conta.

    Responsavel:
      type: object
      properties:
        id_responsavel:
          type: integer
        cpf_responsavel:
          type: string
        nm_responsavel:
          type: string
        nr_telefone_responsavel:
          type: string

    ResponsavelInput:
      type: object
      required: [cpf_responsavel, nm_responsavel, nr_telefone_responsavel]
      properties:
        cpf_responsavel:
          type: string
        nm_responsavel:
          type: string
        nr_telefone_responsavel:
          type: string

    Animal:
      type: object
      properties:
        id_animal:
          type: integer
        rg_animal:
          type: string
          nullable: true
        nr_microchip_animal:
          type: string
          nullable: true
        nm_animal:
          type: string
        dt_nascimento_animal:
          type: string
          format: date
          nullable: true
        peso_animal:
          type: number
          nullable: true
        especie_animal:
          type: string
        raca_animal:
          type: string
          nullable: true
        id_responsavel:
          type: integer

    AnimalInput:
      type: object
      required: [nm_animal, especie_animal, id_responsavel]
      properties:
        nm_animal:
          type: string
        especie_animal:
          type: string
        raca_animal:
          type: string
        dt_nascimento_animal:
          type: string
          format: date
        peso_animal:
          type: number
        rg_animal:
          type: string
          nullable: true
        nr_microchip_animal:
          type: string
          nullable: true
        id_responsavel:
          type: integer

    Consulta:
      type: object
      properties:
        id_consulta:
          type: integer
        historico_consulta:
          type: string
        st_consulta:
          type: string
          enum: [Agendado, Concluido, Atrasado]
        dt_consulta:
          type: string
          format: date
        hr_consulta:
          type: string
          example: "14:30"
        id_animal:
          type: integer

    ConsultaInput:
      type: object
      required: [historico_consulta, dt_consulta, hr_consulta, id_animal]
      properties:
        historico_consulta:
          type: string
        dt_consulta:
          type: string
          format: date
        hr_consulta:
          type: string
          example: "14:30"
        st_consulta:
          type: string
          enum: [Agendado, Concluido, Atrasado]
          description: Se omitido, o backend assume "Agendado"
        id_animal:
          type: integer

    ConsultaUpdateInput:
      type: object
      required: [historico_consulta, dt_consulta, hr_consulta, st_consulta]
      properties:
        historico_consulta:
          type: string
        dt_consulta:
          type: string
          format: date
        hr_consulta:
          type: string
          example: "14:30"
        st_consulta:
          type: string
          enum: [Agendado, Concluido, Atrasado]